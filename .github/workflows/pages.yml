name: Games on GitHub Pages

# Lint, test, build the browser versions with pygbag and publish them to Pages.
# Requires Settings > Pages > Source: "GitHub Actions" (one-time setup).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e '.[dev,web]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Build web versions
        run: python tools/build_web.py

      # Rust/bevy port (rust/): staged under /rust/<game>/ after the Python site.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Tools for the Rust browser builds
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen
          # Must match the wasm-bindgen version in rust/Cargo.lock.
          cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build Rust web versions
        run: python tools/build_rust_web.py

      # Site layout: /gameoflife/, /tetris/, /sandsimulator/ and a landing page at /;
      # the Rust versions at /rust/gameoflife/ and /rust/sandsimulator/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
