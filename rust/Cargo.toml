[workspace]
resolver = "3"
members = ["crates/*", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
sandbox-ui = { path = "crates/sandbox-ui" }
pixelfont = { path = "crates/pixelfont" }
touch = { path = "crates/touch" }
life = { path = "crates/life" }
tetris-core = { path = "crates/tetris-core" }
sand = { path = "crates/sand" }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only what 2D games need: no 3D, glTF, gamepads or extra codecs, to keep the
# browser download small. `webgl2` is the browser backend.
bevy = { version = "=0.20.1", default-features = false, features = [
    "2d",
    "bevy_state",
    "audio",
    "wav",
    "webgl2",
    "x11",
    "wayland",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is slow without optimisations; optimise dependencies even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
